name: Syntax and metadata

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/ha_findmy
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/ha_findmy/manifest.json >/dev/null
          python -m json.tool custom_components/ha_findmy/strings.json >/dev/null
          python -m json.tool custom_components/ha_findmy/translations/en.json >/dev/null
