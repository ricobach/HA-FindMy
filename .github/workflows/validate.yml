name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  syntax:
    name: Syntax and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/ha_findmy
      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/ha_findmy/manifest.json >/dev/null
          python -m json.tool custom_components/ha_findmy/strings.json >/dev/null
          python -m json.tool custom_components/ha_findmy/translations/en.json >/dev/null
